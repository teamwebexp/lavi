<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Family Memories Album | Photo &amp; Video Keepsake</title>
    <meta name="description" content="A modern, premium digital family photo and video memories album with timeline, live milestone counters, and Google Drive auto-sync." />
    <meta property="og:title" content="Family Memories Album | Photo &amp; Video Keepsake" />
    <meta property="og:description" content="Little moments. Beautiful memories. Forever together. A premium digital album for family photos and videos." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Google Fonts: Cormorant Garamond (Editorial Serif) & Plus Jakarta Sans (Crisp Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        // Prevent "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var _origFetch = window.fetch;
          if (typeof _origFetch === 'function') {
            var _activeFetch = _origFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return _activeFetch; },
                set: function(val) { _activeFetch = val; },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              if (typeof Window !== 'undefined' && Window.prototype) {
                try {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() { return _activeFetch; },
                    set: function(val) { _activeFetch = val; },
                    configurable: true,
                    enumerable: true
                  });
                } catch (e2) {}
              }
            }
          }
        } catch (e) {}

        try {
          var saved = localStorage.getItem('family_album_theme_mode');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F5] dark:bg-[#121110] text-stone-800 dark:text-stone-100 antialiased selection:bg-amber-200 selection:text-stone-900 dark:selection:bg-amber-800 dark:selection:text-amber-100 min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
